<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekapitulasi Absensi - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6">

  <!-- PROTEKSI AKSES HALAMAN ADMIN -->
  <script>
    if (sessionStorage.getItem('admin_logged_in') !== 'true' && localStorage.getItem('admin_logged_in') !== 'true') {
      alert("Akses ditolak! Anda harus login sebagai admin terlebih dahulu.");
      window.location.href = "admin-login.html";
    }
  </script>

  <div class="max-w-5xl mx-auto space-y-4">
    
    <!-- PANEL ATAS / HEADER & TOMBOL AKSI -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
        📊 Rekapitulasi Riwayat Absensi
      </h2>

      <div class="flex flex-wrap gap-2">
        <button onclick="window.location.reload()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-1.5 transition">
          🔄 Reload
        </button>
        <button onclick="rekapPerOrang()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-1.5 transition">
          📋 Rekap Per Orang
        </button>
        <button onclick="aturLokasi()" class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-1.5 transition">
          ⚙️ Atur Lokasi
        </button>
        <button onclick="unduhCSV()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-1.5 transition">
          💾 Unduh CSV
        </button>

        <!-- TOMBOL KELUAR / LOGOUT -->
        <button onclick="logoutAdmin()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-1.5 transition">
          🚪 Keluar
        </button>
      </div>
    </div>

    <!-- PANEL FILTER CARI DATA -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex flex-col sm:flex-row gap-2">
        <input type="date" id="filterTanggal" class="border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500">
        <input type="text" id="filterCari" placeholder="Cari Nama / NIP..." class="border border-slate-200 rounded-xl p-2.5 text-sm w-full outline-none focus:border-indigo-500">
        <button onclick="filterData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-medium">
          🔍 Cari
        </button>
        <button onclick="resetFilter()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-medium">
          🔄 Reset Filter
        </button>
      </div>
    </div>

    <!-- TABEL DATA ABSENSI -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 uppercase text-xs font-semibold border-b border-slate-100">
            <tr>
              <th class="p-3.5">TANGGAL</th>
              <th class="p-3.5">JAM</th>
              <th class="p-3.5">JENIS ABSEN</th>
              <th class="p-3.5">NAMA LENGKAP</th>
              <th class="p-3.5">NIP</th>
            </tr>
          </thead>
          <tbody id="tabelAbsensi" class="divide-y divide-slate-100 text-slate-700">
            <tr class="hover:bg-slate-50">
              <td class="p-3.5">08-08-2026</td>
              <td class="p-3.5">07:53:12</td>
              <td class="p-3.5"><span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-medium">Masuk Kerja</span></td>
              <td class="p-3.5 font-medium">Muhamad Fajri</td>
              <td class="p-3.5">4</td>
            </tr>
            <tr class="hover:bg-slate-50">
              <td class="p-3.5">08-08-2026</td>
              <td class="p-3.5">07:53:22</td>
              <td class="p-3.5"><span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-medium">Pulang</span></td>
              <td class="p-3.5 font-medium">Muhamad Fajri</td>
              <td class="p-3.5">4</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // FUNGSI UTAMA LOGOUT ADMIN
    function logoutAdmin() {
      if (confirm("Apakah Anda yakin ingin keluar dari Admin Panel?")) {
        // 1. Bersihkan seluruh session & local storage status admin
        sessionStorage.removeItem('admin_logged_in');
        localStorage.removeItem('admin_logged_in');
        
        // 2. Arahkan kembali ke halaman Admin Login
        window.location.href = "admin-login.html";
      }
    }

    function rekapPerOrang() { alert("Fitur Rekap Per Orang"); }
    function aturLokasi() { alert("Fitur Atur Lokasi"); }
    function unduhCSV() { alert("Mengunduh laporan CSV..."); }
    function filterData() { alert("Menyaring data..."); }
    function resetFilter() {
      document.getElementById('filterTanggal').value = '';
      document.getElementById('filterCari').value = '';
    }
  </script>
</body>
</html>
