<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Rekap Absensi Karyawan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        primary: '#165DFF',
                        success: '#00B42A',
                        danger: '#F53F3F',
                        warning: '#FF7D00'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }
        @media print {
            body * { visibility: hidden; }
            #areaCetak, #areaCetak * { visibility: visible; }
            #areaCetak { position: absolute; left: 0; top: 0; width: 100%; border: none !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Panel Admin - Laporan Rekap Absensi</h1>
        <button id="btnReload" type="button" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold transition">Refresh Data</button>
    </div>

    <!-- PANEL FILTER REKAP -->
    <div class="card space-y-4">
        <h2 class="text-md font-semibold text-gray-700">Filter Rekap Absensi Per Orang</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="filterKaryawan" class="block text-xs font-semibold text-gray-600 mb-1">Pilih Karyawan</label>
                <select id="filterKaryawan" class="w-full border rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-primary">
                    <option value="">-- Memuat Karyawan... --</option>
                </select>
            </div>
            <div>
                <label for="filterTglAwal" class="block text-xs font-semibold text-gray-600 mb-1">Dari Tanggal</label>
                <input type="date" id="filterTglAwal" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            <div>
                <label for="filterTglAkhir" class="block text-xs font-semibold text-gray-600 mb-1">Sampai Tanggal</label>
                <input type="date" id="filterTglAkhir" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
        </div>

        <div class="flex gap-3">
            <button id="btnTampilkanRekap" type="button" class="bg-primary hover:bg-blue-700 text-white py-2 px-5 rounded-lg text-sm font-semibold transition">Tampilkan Rekap</button>
            <button id="btnCetak" type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 px-5 rounded-lg text-sm font-semibold transition">Cetak / PDF</button>
        </div>
    </div>

    <!-- TAMPILAN LAPORAN PRESENSI (1 BARIS PER HARI/SHIFT) -->
    <div id="areaCetak" class="card border space-y-4">
        <div class="text-center border-b pb-3">
            <h2 class="font-bold text-lg text-gray-800 tracking-wide">LAPORAN PRESENSI KARYAWAN</h2>
            <p id="infoPeriode" class="text-xs text-gray-500 mt-1">Periode: -</p>
        </div>

        <div class="flex justify-between items-center text-sm font-medium text-gray-700 bg-gray-50 p-3 rounded-lg border">
            <div class="space-y-1">
                <p>Nama: <span id="rekapNama" class="font-bold text-gray-900">-</span></p>
                <p>Jabatan: <span id="rekapJabatan" class="font-semibold text-gray-800">-</span></p>
            </div>
            <div class="text-right space-y-1">
                <p>NIP: <span id="rekapNip" class="font-semibold text-gray-800">-</span></p>
                <p><span id="totalAbsensiInfo" class="text-primary font-bold">Total Absensi: 0 Record</span></p>
            </div>
        </div>

        <!-- TABEL REKAP 1 BARIS PER HARI/SHIFT -->
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left border-collapse bg-white">
                <thead class="bg-gray-100 text-gray-700 font-semibold border">
                    <tr>
                        <th class="p-2.5 border text-center w-12">No</th>
                        <th class="p-2.5 border w-32">Tanggal</th>
                        <th class="p-2.5 border text-center w-28">Jam Masuk</th>
                        <th class="p-2.5 border text-center w-28">Jam Pulang</th>
                        <th class="p-2.5 border w-48">Shift</th>
                        <th class="p-2.5 border">Keterangan Lokasi</th>
                    </tr>
                </thead>
                <tbody id="tabelRekapBody">
                    <tr>
                        <td colspan="6" class="text-center p-5 text-gray-400">Silakan pilih karyawan dan klik Tampilkan Rekap.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const LINK_API = "https://script.google.com/macros/s/AKfycbx5spIYpBb4DJFopmqTtHTZdzb2c4AIXfbvSLr2XQrI1By1bsKN3Bk89dxB_fOIH85a-g/exec";

let daftarKaryawan = [];
let semuaRiwayatAbsen = [];

function formatTanggalIndo(tglStr) {
    if (!tglStr || tglStr === "-") return "-";
    const p = tglStr.split("-");
    if (p.length === 3) {
        if (p[0].length === 4) return `${p[2]}-${p[1]}-${p[0]}`;
    }
    return tglStr;
}

async function muatDataKaryawan() {
    try {
        const res = await fetch(LINK_API + "?sumber=getKaryawan", { cache: "no-store" });
        const h = await res.json();
        if (h.status === "berhasil") {
            daftarKaryawan = h.data;
            const selectK = document.getElementById("filterKaryawan");
            selectK.innerHTML = `<option value="">-- Pilih Karyawan --</option>`;
            daftarKaryawan.forEach(k => {
                selectK.innerHTML += `<option value="${k.nama}">${k.nama}</option>`;
            });
        }
    } catch (e) {
        alert("Gagal memuat daftar karyawan!");
    }
}

async function muatRiwayatAbsen() {
    try {
        const res = await fetch(LINK_API + "?sumber=getRiwayat", { cache: "no-store" });
        const h = await res.json();
        if (h.status === "berhasil") {
            semuaRiwayatAbsen = h.data;
        }
    } catch (e) {
        console.log("Gagal memuat riwayat absen");
    }
}

document.getElementById("btnTampilkanRekap").addEventListener("click", () => {
    const namaPilih = document.getElementById("filterKaryawan").value;
    const tglAwal = document.getElementById("filterTglAwal").value;
    const tglAkhir = document.getElementById("filterTglAkhir").value;

    if (!namaPilih) return alert("Pilih nama karyawan terlebih dahulu!");

    prosesDanRenderRekap(namaPilih, tglAwal, tglAkhir);
});

document.getElementById("btnCetak").addEventListener("click", () => {
    window.print();
});

function prosesDanRenderRekap(nama, tglAwal, tglAkhir) {
    const detailUser = daftarKaryawan.find(k => k.nama === nama) || { nip: "-", jabatan: "-" };
    document.getElementById("rekapNama").textContent = nama;
    document.getElementById("rekapNip").textContent = detailUser.nip || "-";
    document.getElementById("rekapJabatan").textContent = detailUser.jabatan || "-";
    
    const infoAwal = tglAwal ? formatTanggalIndo(tglAwal) : 'Semua';
    const infoAkhir = tglAkhir ? formatTanggalIndo(tglAkhir) : 'Semua';
    document.getElementById("infoPeriode").textContent = `Periode: ${infoAwal} s/d ${infoAkhir}`;

    const dataFiltered = semuaRiwayatAbsen.filter(item => {
        if (item.nama !== nama) return false;
        if (tglAwal && item.waktu < tglAwal) return false;
        if (tglAkhir && item.waktu > tglAkhir) return false;
        return true;
    });

    const rekapMap = {};

    dataFiltered.forEach(item => {
        const key = `${item.waktu}_${item.shift}`;

        if (!rekapMap[key]) {
            rekapMap[key] = {
                tanggal: item.waktu,
                shift: item.shift || "-",
                jamMasuk: "-",
                jamPulang: "-",
                lokasiMasuk: "",
                lokasiPulang: ""
            };
        }

        const jenis = String(item.jenis).toLowerCase();

        if (jenis.includes("masuk")) {
            rekapMap[key].jamMasuk = item.jam;
            rekapMap[key].lokasiMasuk = item.lat && item.lng ? `Lat: ${item.lat}, Lng: ${item.lng}` : "";
        } else if (jenis.includes("pulang")) {
            rekapMap[key].jamPulang = item.jam;
            rekapMap[key].lokasiPulang = item.lat && item.lng ? `Lat: ${item.lat}, Lng: ${item.lng}` : "";
        }
    });

    const tbody = document.getElementById("tabelRekapBody");
    tbody.innerHTML = "";

    const dataGrouped = Object.values(rekapMap);

    if (dataGrouped.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center p-5 text-gray-500">Tidak ada data absensi pada periode ini.</td></tr>`;
        document.getElementById("totalAbsensiInfo").textContent = "Total Absensi: 0 Record";
        return;
    }

    let no = 1;
    dataGrouped.forEach(row => {
        let ketLokasi = "-";
        if (row.lokasiMasuk && row.lokasiPulang) {
            ketLokasi = `${row.lokasiMasuk}`;
        } else if (row.lokasiMasuk) {
            ketLokasi = row.lokasiMasuk;
        } else if (row.lokasiPulang) {
            ketLokasi = row.lokasiPulang;
        }

        const tr = document.createElement("tr");
        tr.className = "border-b hover:bg-gray-50 text-gray-800";
        tr.innerHTML = `
            <td class="p-2.5 border text-center font-medium">${no++}</td>
            <td class="p-2.5 border">${formatTanggalIndo(row.tanggal)}</td>
            <td class="p-2.5 border text-center font-semibold text-gray-800">${row.jamMasuk}</td>
            <td class="p-2.5 border text-center font-semibold text-gray-800">${row.jamPulang}</td>
            <td class="p-2.5 border text-blue-600 font-medium">${row.shift}</td>
            <td class="p-2.5 border text-xs text-gray-600">${ketLokasi}</td>
        `;
        tbody.appendChild(tr);
    });

    document.getElementById("totalAbsensiInfo").textContent = `Total Absensi: ${dataGrouped.length * 2} Record`;
}

document.getElementById("btnReload").addEventListener("click", async () => {
    await muatDataKaryawan();
    await muatRiwayatAbsen();
    alert("Data berhasil diperbarui!");
});

document.addEventListener("DOMContentLoaded", async () => {
    await muatDataKaryawan();
    await muatRiwayatAbsen();
});
</script>
</body>
</html>
